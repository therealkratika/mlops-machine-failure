
name: Machine Failure MLOps Pipeline

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # JOB 1: Train model and run tests
  train-and-test:
    name: Train Model and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start MLflow server
        run: |
          nohup mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlartifacts \
            --host 127.0.0.1 \
            --port 7001 \
            > mlflow-server.log 2>&1 &

          echo $! > mlflow.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:7001/health; then
              echo "MLflow server is ready"
              exit 0
            fi
            sleep 2
          done

          echo "MLflow server failed to start"
          cat mlflow-server.log
          exit 1

      - name: Train and log model with MLflow
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:7001
        run: |
          python -m src.train

      - name: Run pytest
        run: |
          python -m pytest -v

      - name: Stop MLflow server
        if: always()
        run: |
          if [ -f mlflow.pid ]; then
            kill "$(cat mlflow.pid)" || true
          fi

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.joblib
          if-no-files-found: error
          retention-days: 7


  # JOB 2: Build, test and publish Docker image
  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: train-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Verify model artifact
        run: |
          ls -lh models/
          test -f models/model.joblib

      - name: Build Docker image
        run: |
          docker build -t predictive-maintenance-api:latest .

      - name: Run Docker container
        run: |
          docker run -d \
            --name predictive-maintenance-container \
            -p 8000:8000 \
            predictive-maintenance-api:latest

      - name: Test API health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "API failed to become healthy"
          docker logs predictive-maintenance-container
          exit 1

      - name: Test prediction endpoint
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "Type": "M",
              "air_temperature": 298.1,
              "process_temperature": 308.6,
              "rotational_speed": 1551,
              "torque": 42.8,
              "tool_wear": 0
            }'

      - name: Stop Docker container
        if: always()
        run: |
          docker stop predictive-maintenance-container || true
          docker rm predictive-maintenance-container || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}